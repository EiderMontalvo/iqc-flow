spring:
  application:
    name: iqc-flow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iqc_flow}
    username: ${DB_USERNAME:iqc_dev}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
